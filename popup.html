<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GMB Toolkit</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { width:330px; font-family:system-ui, sans-serif; margin:0; }
  nav { display:flex; }
  nav button { flex:1; padding:6px; border:none; background:#eee; cursor:pointer; }
  nav button.active { background:#0b57d0; color:#fff; }
  section { display:none; padding:8px; }
  section.active { display:block; }
</style>
</head>
<body>
  <nav>
    <button data-tab="tp" class="active">Teleport</button>
    <button data-tab="gmb">Info</button>
    <button data-tab="rev">Reviews</button>
  </nav>
  <section id="tp" class="active">
    <label>Search query<br><input id="tp_query" type="text" placeholder="e.g. coffee near Times Sq"></label>
    <button id="tp_go">Open Teleport Map</button>
  </section>
  <section id="gmb">
    <p>Open a Google Maps Place page – details will appear here.</p>
    <pre id="gmb_box" style="font-size:11px"></pre>
  </section>
  <section id="rev">
    <button id="rev_go">Analyze this business’ reviews</button>
    <canvas id="rev_chart" height="180"></canvas>
  </section>
  <script src="popup.js"></script>
  <script src="libs/chart.min.js"></script>
</body>
</html>
